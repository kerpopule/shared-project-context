[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "shared-project-context"
version = "0.1.0"
description = "Local, vendor-neutral project continuity for cooperating coding agents"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
dependencies = []

[project.scripts]
shared-context = "shared_context.__main__:main"

[tool.setuptools.packages.find]
include = ["shared_context*"]
